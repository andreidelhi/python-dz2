name: Проверки Python

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка uv
        run: python -m pip install uv==0.13.1
      - name: Установка зависимостей
        run: make install
      - name: Линтер, тесты и сборка
        run: make check
      - name: Проверка форматирования
        run: uv run ruff format --check .
      - name: Проверка метаданных дистрибутива
        run: uvx twine check dist/*
